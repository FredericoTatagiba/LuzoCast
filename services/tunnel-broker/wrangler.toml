# LuzoCast Tunnel Broker — preencha os TODOs quando tiver o domínio.
# Passo a passo: docs/link-personalizado.md
name = "luzocast-tunnel-broker"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# Rota pública do broker (subdomínio dedicado).
# TODO: trocar pelo seu domínio
routes = [{ pattern = "api.SEU-DOMINIO.app", custom_domain = true }]

[vars]
DOMAIN = "SEU-DOMINIO.app"          # TODO
CF_ACCOUNT_ID = "TODO"
CF_ZONE_ID = "TODO"
HOST_PREFIX = ""                     # "luzocast-" para luzocast-abc123.dominio
MAX_ACTIVE_SESSIONS = "50"
SESSION_TTL_HOURS = "12"
# CF_API_TOKEN é SEGREDO: `npx wrangler secret put CF_API_TOKEN` (nunca coloque aqui)

[[kv_namespaces]]
binding = "SESSIONS"
id = "TODO"                          # `npx wrangler kv namespace create SESSIONS`

# Limite por IP: 10 criações de sessão por minuto.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Limpeza de sessões vencidas a cada 30 min.
[triggers]
crons = ["*/30 * * * *"]
